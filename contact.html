<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Kontak - Sandi</title>
</head>
<body>
    <header>
        <nav>
            <a class="logo" href="index.html">SANDI</a>
            <div class="nav-links">
                <a href="index.html#home">Home</a>
                <a href="index.html#about">About</a>
                <a href="portofolio.html">Projects</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>
    </header>

    <main>
        <section id="contact" class="section-box">
            <h2>Hubungi Saya</h2>
            <form>
                <label for="nama">Nama</label>
                <input type="text" id="nama" name="nama" placeholder="Nama kamu" required>
                
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="nama@email.com" required>
                
                <label for="pesan">Pesan</label>
                <textarea id="pesan" name="pesan" rows="4" placeholder="Tulis pesan..." required></textarea>
                
                <button type="submit">Kirim Pesan</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sandi. Dibuat dengan HTML dan CSS.</p>
    </footer>
</body>
</html>
